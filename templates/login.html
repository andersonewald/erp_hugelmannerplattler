<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hügelmänner Plattler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { 
            background-color: #f4f6f9; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .card-login { 
            max-width: 400px; 
            width: 100%; 
            border: none; 
            border-radius: 16px; 
            box-shadow: 0 4px 25px rgba(0,0,0,0.1); 
        }
        .logo-brasao {
            max-width: 140px;
            height: auto;
            margin-bottom: 12px;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.15));
        }
    </style>
</head>
<body>
<div class="card card-login p-4">
    <div class="text-center mb-3">
        <!-- BRASÃO DO GRUPO -->
        <img src="{{ url_for('static', filename='img/brasao.png') }}" alt="Brasão Hügelmänner Plattler" class="logo-brasao">
        <h4 class="fw-bold text-success mb-1">Acesso ao Sistema</h4>
        <small class="text-muted fw-semibold">Gestão Cultural Hügelmänner Plattler</small>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show mb-3 py-2 small" role="alert">
             {{ message }}
             <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">USUÁRIO</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" name="login" class="form-control" required autofocus placeholder="Digite seu login">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">SENHA</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                <input type="password" name="senha" class="form-control" required placeholder="Digite sua senha">
            </div>
        </div>

        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Entrar no Sistema</button>
    </form>
</div>
</body>
</html>
